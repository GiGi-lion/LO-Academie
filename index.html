<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <!-- ERROR TRAP (Runtime Errors) -->
    <script>
      window.addEventListener('error', function(event) {
        const root = document.getElementById('root');
        if (root) {
           console.error("Critical Start Error:", event.error);
           root.innerHTML = `
            <div style="padding: 20px; color: #ef4444; font-family: sans-serif; text-align: left; margin-top: 50px;">
              <h2 style="font-size: 24px; margin-bottom: 10px;">⚠️ Oeps, er ging iets mis</h2>
              <p>De applicatie kon niet starten. Hier zijn de specifieke details:</p>
              <pre style="background: #eee; padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px;">
Message: ${event.message}
Error Object: ${event.error ? JSON.stringify(event.error, Object.getOwnPropertyNames(event.error), 2) : 'N/A'}
Stack: ${event.error && event.error.stack ? event.error.stack : 'N/A'}
LocalStorage Keys: ${Object.keys(localStorage).join(', ')}
              </pre>
              <button onclick="localStorage.clear(); window.location.reload();" style="margin-top: 15px; padding: 10px 15px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">Wis Geheugen & Herlaad</button>
            </div>
          `;
        }
      });

      window.addEventListener('unhandledrejection', function(event) {
        const root = document.getElementById('root');
        if (root) {
           console.error("Unhandled Rejection:", event.reason);
           root.innerHTML = `
            <div style="padding: 20px; color: #ef4444; font-family: sans-serif; text-align: left; margin-top: 50px;">
              <h2 style="font-size: 24px; margin-bottom: 10px;">⚠️ Oeps, er ging iets mis (Promise Rejection)</h2>
              <p>De applicatie kon niet starten. Hier zijn de specifieke details:</p>
              <pre style="background: #eee; padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px;">
Reason: ${event.reason}
Message: ${event.reason && event.reason.message ? event.reason.message : 'N/A'}
Stack: ${event.reason && event.reason.stack ? event.reason.stack : 'N/A'}
LocalStorage Keys: ${Object.keys(localStorage).join(', ')}
              </pre>
              <button onclick="localStorage.clear(); window.location.reload();" style="margin-top: 15px; padding: 10px 15px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">Wis Geheugen & Herlaad</button>
            </div>
          `;
        }
      });
    </script>
  </body>
